[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "brand-name-finder"
version = "0.1.0"
description = "Generate, score, and pre-check brand-name candidates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
brand-name-finder = "brand_name_finder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brand_name_finder"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
