[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "brand-name-finder"
version = "0.1.0"
description = "Generate, score, and pre-check brand-name candidates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
brand-name-finder = "brand_name_finder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brand_name_finder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["brand_name_finder"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
